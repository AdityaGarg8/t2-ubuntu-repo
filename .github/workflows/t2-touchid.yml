---
name: Create t2-touchid package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
      revision:
        description: 'Revision (default = 1)'
        required: false
jobs:
  Publish:
    runs-on: ubuntu-latest
    steps:

      - name: 'Checkout Repo'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Configure GPG Key
        run: |
          echo -n "$GPG_SIGNING_KEY" | base64 -di | gpg --import
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}

      - name: Get the source code
        id: publish
        run: |
          VERSION="${{ github.event.inputs.version }}"
          REVISION="${{ github.event.inputs.revision }}"
          if [ -z "$REVISION" ]; then
          REVISION=1
          fi
          sudo apt update
          sudo apt-get install -y build-essential dpkg-dev libinput-dev libudev-dev pkg-config
          cp -r ./sources/t2-touchid ./deb
          sed -i "s/VERSION/${VERSION}-${REVISION}/g" ./deb/DEBIAN/control
          git clone --depth 1 https://github.com/kaiT2en/KaiT2en-Fedora.git
          cd KaiT2en-Fedora/t2-services/t2-touchid
          cargo build --release --locked --target-dir target
          cd ${{ github.workspace }}
          mkdir -p deb/usr/bin
          cp KaiT2en-Fedora/t2-services/t2-touchid/target/release/t2-touchid deb/usr/bin/t2-touchid
          install -Dm0644 KaiT2en-Fedora/t2-services/t2-touchid/integration/dbus/org.kait2en.TouchId.conf \
            deb/usr/share/dbus-1/system.d/org.kait2en.TouchId.conf

          # Record the ABI requirements of the libraries used by this build.
          SHLIBS_DIR="$(mktemp -d)"
          mkdir -p "$SHLIBS_DIR/debian"
          printf 'Source: t2-touchid\n\nPackage: t2-touchid\nArchitecture: amd64\n' > "$SHLIBS_DIR/debian/control"
          ln -s "${{ github.workspace }}/deb" "$SHLIBS_DIR/debian/t2-touchid"
          SHLIBS_DEPENDS="$(cd "$SHLIBS_DIR" && dpkg-shlibdeps -O debian/t2-touchid/usr/bin/t2-touchid)"
          SHLIBS_DEPENDS="${SHLIBS_DEPENDS#shlibs:Depends=}"
          test -n "$SHLIBS_DEPENDS"
          sed -i "s/SHLIBS_DEPENDS/${SHLIBS_DEPENDS}/g" ./deb/DEBIAN/control
          rm -rf "$SHLIBS_DIR"

          dpkg-deb --build --root-owner-group -Zgzip deb

          # Packages & Packages.gz
          rm ./t2-touchid*.deb || true
          dpkg-name ./deb.deb
          rm -rf ./deb
          rm -rf ./KaiT2en-Fedora
          dpkg-scanpackages --multiversion . > Packages
          gzip -k -f Packages
          # Release, Release.gpg & InRelease
          apt-ftparchive release . > Release
          gpg --default-key "${GPG_SIGNING_EMAIL}" -abs -o - Release > Release.gpg
          gpg --default-key "${GPG_SIGNING_EMAIL}" --clearsign -o - Release > InRelease
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "Update t2-touchid to ${VERSION}-${REVISION}"
        env:
          GPG_SIGNING_EMAIL: ${{ secrets.GPG_SIGNING_EMAIL }}
      - name: Push changes to the repo
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
