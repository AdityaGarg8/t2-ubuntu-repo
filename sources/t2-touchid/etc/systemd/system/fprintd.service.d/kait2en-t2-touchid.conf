# Points fprintd at libfprint's virtual storage device, which t2-touchid drives
# with the verdicts of the real T2 sensor. Without this drop-in fprintd finds no
# fingerprint reader on a T2 Mac.
# Without the bridge the virtual device would still be advertised and every
# sudo would wait for a finger nobody can report. Tie fprintd to it, so that a
# stopped bridge means no fingerprint reader and PAM falls straight through to
# the password.
[Unit]
Requires=kait2en-t2-touchid.service
After=kait2en-t2-touchid.service

[Service]
Environment=FP_VIRTUAL_DEVICE_STORAGE=/run/t2-touchid/fprint.sock
ReadWritePaths=/run/t2-touchid
# Declared here as well so the directory exists whenever fprintd runs, even if
# the bridge happens to be stopped.
RuntimeDirectory=t2-touchid
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=yes
